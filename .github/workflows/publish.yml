name: publish

on:
  # Publish by pushing a tag: git tag v0.2.0 && git push --tags
  push:
    tags: ["v*"]
  # Or from the Actions tab, with a dry run first if you want to look before leaping.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and inspect without publishing"
        type: boolean
        default: false

permissions:
  contents: read
  # Required for npm provenance — this is what lets npm attest that the
  # tarball was built by this workflow from this commit, rather than uploaded
  # from someone's laptop. Worth having for a package that reimplements a
  # vendor tool.
  id-token: write

jobs:
  # The same gates as CI. A publish is forever, so nothing goes out unverified.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The only check that sees the exports map, the bin, and the
      # self-referencing dynamic import — all of which only resolve from a
      # real install.
      - run: npm run test:pack

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Fail loudly if the tag and package.json disagree, rather than
      # publishing a version nobody expected.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public
